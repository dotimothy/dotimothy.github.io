<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a1a">
  <title>Timothy Do · 3D Portfolio</title>
  <link rel="icon" href="../assets/game/img/favicon.png">
  <link rel="stylesheet" href="../assets/game/portfolio-3d.css">
</head>
<body class="portfolio-world">
  <main class="world">
    <header class="world-toolbar">
      <div class="world-player"><img src="../assets/game/img/logo.png" width="44" height="44" alt=""><h1>Timothy Do <span>3D Portfolio</span></h1></div>
      <nav aria-label="View controls">
        <a href="#board" id="world-map" hidden>Board Map</a>
        <a href="../" id="world-exit">Return to 2D</a>
      </nav>
    </header>
    <div id="world-stage" aria-label="Interactive 3D board">
      <div id="world-zoom" role="group" aria-label="Map zoom" hidden>
        <button type="button" aria-label="Zoom out">−</button>
        <button type="button" aria-label="Reset map zoom" title="Reset map zoom">100%</button>
        <button type="button" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div id="world-walk" hidden>
      <span class="walk-hint">Move with WASD or arrow keys · E to enter</span>
      <div class="walk-pad" aria-label="Move Timothy" role="group">
        <button data-dir="left" aria-label="Walk left">←</button>
        <button data-dir="up" aria-label="Walk forward">↑</button>
        <button data-dir="down" aria-label="Walk backward">↓</button>
        <button data-dir="right" aria-label="Walk right">→</button>
      </div>
      <button id="world-interact" hidden>Enter</button>
    </div>
    <p id="world-status" role="status">Loading the 3D Board…</p>
    <nav id="world-destinations" class="world-alternative" aria-label="Board destinations">
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#interests">Interests</a>
      <a href="#contact">Contact</a>
    </nav>
    <article id="world-exhibit" class="world-alternative" hidden>
      <h2 tabindex="-1"></h2>
      <img id="world-thumbnail" alt="">
      <p></p>
      <nav aria-label="Exhibit controls"></nav>
    </article>
    <noscript><p>Enable JavaScript to explore the board, or choose Return to 2D.</p></noscript>
  </main>
  <script src="../assets/game/projects.js"></script>
  <script type="module" src="../assets/game/portfolio-3d-mode.js"></script>
</body>
</html>
