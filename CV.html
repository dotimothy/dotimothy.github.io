<html>

<title>Timothy Do's Curriculum Vitae</title>
<link rel="shortcut icon" type="image/png" href="images/favicon.png" />
<meta charset="UTF-8">

<style>
	body {
		width: 100%;
		height:  100%;
		margin: 0;
	}
	p {
		font-family: Georgia;
		color: white;
		background-color: black;
		font-size: 3em;
		position: fixed;
		bottom: 1%;
		right: 3%;
		opacity: 0.75;
	}
	p:hover {
		opacity: 0.25;
		transition: 0.25s;
	}
	p:active {
		opacity: 1;
		transition: 0.25s;
	}
	#downloadCV {
		bottom: 11%;
		right: 3%;
	}
	#printCV {
		bottom: 1%;
		right:  3%;
	}
</style>

<script>
function loadCV() {
  var container = document.getElementById("CV-container");
  var iframe = document.createElement("iframe");
  iframe.setAttribute("src", "https://docs.google.com/gview?url=https://dotimothy.github.io/CV.pdf&embedded=true");
  iframe.setAttribute("width", "100%");
  iframe.setAttribute("height", "100%");
  iframe.setAttribute("frameborder", "0");
  container.appendChild(iframe);
}

function printCV() {
	document.getElementById("printFrame").contentWindow.print();
}
</script>

<body onload="loadCV()">

<div id="CV-container"></div>
<iframe hidden id="printFrame" src="./CV.pdf"></iframe>

</body>

<a href="./CV.pdf" download="TimothyDo_CV.pdf"><p id="downloadCV">Download 📝</p></a>
<p id="printCV" onclick='printCV()'>Print 🖨️</p>

</html>
