
<!-- Slow Motion Video Player on the Web -->
<!DOCTYPE html>

<html>

<head>
  <title>Slow Motion Video PLayer</title>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
</head>

<style>
  * {
    font-family:  Courier;
    color:  whitesmoke;
  }
  body {
    background-color:  black;
  }
  button {
  	font-size: 2em;
    background-color: yellow;
    color: black;
  }
  video {
  	z-index: 2;
  }
  #controls {
  	z-index: 3;
  	position: absolute;
  	bottom: 5%;
  	right: 5%;
  }
</style>


<script>
	var currentSpeed = 100;
	function updateCurrent() {
		let current = document.getElementById('current');
		current.innerHTML = "<h2>Current Speed: " + currentSpeed + "%</h2>";
	}

   	function changeSpeed(percentage) {
		document.querySelector('video').playbackRate = (percentage/100); 
	}

	function slower() {
		if(currentSpeed > 6.25) {
			currentSpeed /= 2;
			changeSpeed(currentSpeed);
			updateCurrent();
		}
		else {
			alert("Slowest Speed Reached.");
		}
	}

	function faster() {
		if(currentSpeed < 1600) {
			currentSpeed *= 2;
			changeSpeed(currentSpeed);
			updateCurrent();
		}
		else  {
			alert("Fastest Speed Reached.");
		}
	}

	let isFullScreen = false;
	function fullscreenToggle() {
		let vid = document.querySelector('video');
		if(!isFullScreen) {
			vid.width = screen.width;
			vid.height = screen.height;
		}
		else {
			vid.width *= 0.33;
			vid.height *= 0.33;
		}
		isFullScreen = !isFullScreen;
	}
</script>

<body onload="updateCurrent()">
  <h1>SloMo Video Player in Browser</h1>
  <input type="file" accept="video/*">
  <br> <br>
  <video onclick="fullscreenToggle()" width="75%" autoplay loop></video>
  <br><br>
  <div id="controls" hidden>
  	<div id="current"></div>
  	<button onclick="faster()">x2</button>
  	<button onclick="slower()">/2</button>
  </div>
</body>


<script type="text/javascript">
 (function localFileVideoPlayer() {
    'use strict'
    var playSelectedFile = function(event) {
    document.querySelector('div').hidden = false;
    var file = this.files[0]
    var URL = window.URL || window.webkitURL 
    var fileURL = URL.createObjectURL(file)
    var videoNode = document.querySelector('video')
    videoNode.src = fileURL
    }
    var inputNode = document.querySelector('input')
    inputNode.addEventListener('change', playSelectedFile, false)
 })()
</script>

</html>
