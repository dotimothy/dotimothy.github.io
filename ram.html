<body>
	<div id="result">
	</div>
</body>

<script>
	alert("You will see your CPU and RAM go up.")
	var i, j, k, l, sum;
	for(i = 0; i < 1000; i++) {
		for(j = 0; j < 1000; j++) {
			for(k = 0; k < 1000; k++) {
				for(l = 0; l < 1000; l++) {
					sum *= i;
					sum *= j;
					sum *= k; 
					sum *= l;
					document.getElementById("result").innerHTML = "Sum = " + sum;
				}
			}
		}
	}
</script>
