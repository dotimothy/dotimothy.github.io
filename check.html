<body onload="calculate()">
	<h1>Screen Resolution & FPS Checker by <a href="https://dotimothy.github.io/real.html">Timothy Do</a></h1>
	<div id="resolution"></div>
	<div id="aspectRatio"></div>
	<div id="fps"></div>
</body>

<style>
	h1, h2 {
		font-family: Verdana;
	}
</style>

<script>
	var width = screen.width;
	var height = screen.height;
	var t = [];

	//For Calculating Everything
	function calculate() {
		displayResolution();
		displayRatio();
	}

	//Displaying Width and Height
	function displayResolution() {
		document.getElementById('resolution').innerHTML = "<h2> Screen Resolution: " + width + "x" + height + "</h2>";
	}
	
	//Displaying Aspect Ratio
	function displayRatio() {
		var factor = gcd(width, height);
		var widthAspect = width / factor;
		var heightAspect = height / factor;
		document.getElementById('aspectRatio').innerHTML = "<h2> Aspect Ratio: " + widthAspect + ":" + heightAspect + "</h2>" ;
	}

	 function gcd (a, b) {
        return (b == 0) ? a : gcd (b, a%b);
     }

     if (!window.requestAnimationFrame) {
    	window.requestAnimationFrame = window.mozRequestAnimationFrame || window.webkitRequestAnimationFrame;
	}



	function animate(now) {
	    t.unshift(now);
	    if (t.length > 10) {
	        var t0 = t.pop();
	        var fps = Math.floor(1000 * 10 / (now - t0));
	        document.getElementById('fps').innerHTML = "<h2> Current Refresh Rate: " + fps + " fps </h2>";
	    }
	    window.requestAnimationFrame(animate);
		};

		window.requestAnimationFrame(animate);


</script>
