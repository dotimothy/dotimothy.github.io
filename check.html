<body onload="calculate()">
	<p>Quick Screen Resolution & FPS Checker by Timothy Do</p>
	<div id="resolution"></div>
	<div id="aspectRatio"></div>
	<div id="fps"></div>
</body>

<script>
	var width = screen.width;
	var height = screen.height;
	var t = [];

	//For Calculating Everything
	function calculate() {
		displayResolution();
		displayRatio();
	}

	//Displaying Width and Height
	function displayResolution() {
		document.getElementById('resolution').innerHTML = " Screen Resolution: " + width + "x" + height + "<br></br>";
	}
	
	//Displaying Aspect Ratio
	function displayRatio() {
		var factor = gcd(width, height);
		var widthAspect = width / factor;
		var heightAspect = height / factor;
		document.getElementById('aspectRatio').innerHTML = "Aspect Ratio is " + widthAspect + ":" + heightAspect + "<br></br>" ;
	}

	 function gcd (a, b) {
        return (b == 0) ? a : gcd (b, a%b);
     }

     if (!window.requestAnimationFrame) {
    window.requestAnimationFrame =
        window.mozRequestAnimationFrame ||
        window.webkitRequestAnimationFrame;
	}



	function animate(now) {
	    t.unshift(now);
	    if (t.length > 10) {
	        var t0 = t.pop();
	        var fps = Math.floor(1000 * 10 / (now - t0));
	        document.getElementById('fps').innerHTML = "Current Refresh Rate: " + fps + " fps <br></br>";
	    }
	    window.requestAnimationFrame(animate);
		};

		window.requestAnimationFrame(animate);


</script>
