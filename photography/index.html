<!doctype html>

<html>

<head>
    <title>TheDoShoots</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Product+Sans' rel='stylesheet' type='text/css'>
    <meta charset="utf-8" />
</head>

<base target="_blank">

<style>
    * {
        font-family: Product Sans;
        box-sizing: border-box; /* Add this for consistent box model */
    }
    body {
        background-color: black;
        margin: 0; /* Remove default body margin */
        padding: 0;
    }
    h1,h2 {
        color: white;
    }
    a {
        color:  blue;
    }
    a:hover {
        color: yellow;
        transition: 0.25s;
    }
    .pfp {
        clip-path:  circle();
        margin-left:  auto;
        margin-right:  auto;
        display: block;
        transition: 0.25s;
        animation: fadein 1s;
    }
    .pfp:hover {
        transform: scale(2.5) translateY(50%);
        transition: 0.25s;
    }
    .center {
        margin: auto;
        border-radius: 50px;
        padding: 0.5em;
        text-align: center;
    }
    .box {
        border: 0.25em solid yellow;
        background-color: yellow;
        padding: 0.5em;
        margin-bottom: 1em;
        animation: fadein 1s;
    }
    .box:hover {
        background-color: white;
        border: 0.25em solid white;
        transition: 0.25s;
    }
    .social-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        animation: fadein 1s;
    }
    .social-logo {
        opacity: 1;
        transition: opacity 0.25s;
    }
    .social-logo:hover {
        opacity: 0.5;
        transition: opacity 0.25s;
    }
    @keyframes fadein {
        0% {opacity: 0%;}
        100% {opacity: 100%;}
    }

    /* Styles for the iframe modal/overlay */
    .iframe-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85); /* Darker overlay */
        display: none; /* Hidden by default */
        justify-content: center;
        align-items: center;
        z-index: 1000; /* Ensure it's on top */
        animation: fadein 0.3s;
    }

    /* Make the iframe fill the overlay */
    .iframe-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
        background-color: white; /* Ensure a white background for the content area */
    }

    .close-button {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        color: white;
        font-size: 2.5em; /* Larger X */
        cursor: pointer;
        z-index: 1001; /* Ensure close button is above iframe */
        transition: transform 0.2s;
    }

    .close-button:hover {
        transform: scale(1.2);
    }


    /* Desktop */
    @media only screen and (min-width: 1000px) {
        h1 { font-size:  3.5em; }
        h2 { font-size:  2.5em; }
        .center { width: 50%; }
        .pfp { width: 30%; }
    }
    /* Mobile */
    @media only screen and (max-width: 1000px) {
        h1 { font-size: 5em; }
        h2 { font-size:  4em; }
        .center { width: 75%; }
        .pfp { width: 50%; }
        .close-button { font-size: 2em; top: 5px; right: 10px; }
    }
</style>

<body>
    <div class="center">
        <img class="pfp" src="./photographer.jpg" alt="EagleScout">
        <h1>📷 TheDoShoots by <a href="https://timothydo.me">Timothy Do</a> 📷</h1>
    </div>
    <div class="center box">
        <h2>🌌<a href="https://timothydo.me/astronomy/photography" class="gallery-link" data-gallery-id="astronomy">Astrophotography</a></h2>
    </div>
    <div class="center box">
        <h2>🐿️<a href="./wildlife/index.html" class="gallery-link" data-gallery-id="wildlife">Wildlife</a></h2>
    </div>
    <div class="center box">
        <h2>👋<a href="./about.html" class="gallery-link" data-gallery-id="about">About Me</a></h2>
    </div>
            
    <div class="social-icons">
        <a class="social-logo" href="https://instagram.com/thedoshoots"><i class="fab fa-instagram fa-5x" style="color: white;"></i></a>
        <a class="social-logo" href="https://www.flickr.com/photos/169526448@N03/"><i class="fab fa-flickr fa-5x" style="color: white;"></i></a>
    </div>

    <div class="iframe-overlay" id="galleryOverlay">
        <button class="close-button" id="closeGallery">&times;</button>
        <iframe id="galleryIframe" src="" frameborder="0"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleryLinks = document.querySelectorAll('.gallery-link');
            const galleryOverlay = document.getElementById('galleryOverlay');
            const galleryIframe = document.getElementById('galleryIframe');
            const closeButton = document.getElementById('closeGallery');

            // Function to close the iframe overlay
            const closeIframeOverlay = () => {
                galleryOverlay.style.display = 'none'; // Hide the overlay
                galleryIframe.src = ''; // Clear the iframe src to stop any media playing
                document.body.style.overflow = ''; // Re-enable body scrolling
            };

            galleryLinks.forEach(link => {
                link.addEventListener('click', (event) => {
                    event.preventDefault(); // Prevent default link behavior (navigating to the page)
                    const contentUrl = event.currentTarget.href; // Get the URL from the clicked link

                    galleryIframe.src = contentUrl; // Set the iframe's source to the URL
                    galleryOverlay.style.display = 'flex'; // Show the overlay (which contains the iframe)

                    // Optional: Add a class to body to disable scrolling while overlay is open
                    document.body.style.overflow = 'hidden';
                });
            });

            closeButton.addEventListener('click', closeIframeOverlay);

            // Optional: Close overlay if user clicks outside the iframe (now the iframe-overlay itself)
            galleryOverlay.addEventListener('click', (event) => {
                // Check if the click was directly on the overlay, not on the iframe or close button
                if (event.target === galleryOverlay) {
                    closeIframeOverlay();
                }
            });

            // Keyboard event listener for Escape key
            document.addEventListener('keydown', (event) => {
                // Check if the overlay is currently visible and the pressed key is Escape
                if (galleryOverlay.style.display === 'flex' && event.key === 'Escape') {
                    closeIframeOverlay();
                }
            });
        });
    </script>
</body>

</html>
