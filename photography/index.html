<!doctype html>
<html>

<head>
    <title>TheDoShoots by Timothy Do</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<base target="_blank">

<style>
    * {
        font-family: Roboto, sans-serif;
        box-sizing: border-box;
    }

    /* Apply the full-page background to the html element */
    html {
        background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)), url('./photographer.jpg') no-repeat center center/cover fixed;
        min-height: 100%;
    }

    body {
        background-color: transparent;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    h1,
    h2,
    .secondary-text {
        color: white;
    }

    a {
        color: #00BFFF; /* Deep sky blue */
        text-decoration: none;
    }

    a:hover {
        color: yellow;
        transition: 0.25s;
    }

    .pfp {
        border-radius: 50%;
        z-index: 10000;
        transition: 0.25s;
        animation: fadein 0.5s forwards;
        animation-delay: 0s;
        border: 5px solid yellow;
    }

    .center {
        margin-bottom: 0.5em;
        border-radius: 50px;
        padding: 0.5em;
        text-align: center;
    }

    .box {
        border: 0.25em solid rgba(255, 255, 0, 0.7);
        background-color: rgba(0, 0, 0, 0.5);
        padding: 0.5em;
        margin-bottom: 0.5em; /* Reduced vertical space between boxes */
        margin-left: auto; /* Center the box */
        margin-right: auto; /* Center the box */
        max-width: 600px;
        width: 90%;
        opacity: 0;
        animation: fadein 0.5s ease-out forwards;
    }

    .box:nth-of-type(3) { animation-delay: 0.1s; }
    .box:nth-of-type(4) { animation-delay: 0.2s; }
    .box:nth-of-type(5) { animation-delay: 0.3s; }

    .box:hover {
        background-color: rgba(255, 255, 255, 0.2);
        border: 0.25em solid white;
        transition: 0.25s;
    }

    .social-icons {
        display: flex;
        justify-content: center;
        gap: 10px; /* Reduced gap for more compaction */
        margin-top: 20px;
        animation: fadein 0.5s forwards;
        animation-delay: 0s;
        margin-bottom: 20px;
    }

    .social-logo {
        opacity: 1;
        transition: opacity 0.25s;
        color: white;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
    }

    .social-logo:hover {
        opacity: 0.5;
        transition: opacity 0.25s;
    }

    @keyframes fadein {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    /* --- HERO SECTION STYLES --- */
    .hero-section {
        width: 100%;
        min-height: 100vh;
        background: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 2em 1em;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        position: relative;
        z-index: 1;
    }

    /* NEW CONTAINER FOR PFP TO MAINTAIN SPACE */
    .pfp-container {
        width: 250px;
        height: 250px;
        margin-left: auto;
        margin-right: auto;
        margin-bottom: 1em;
        position: relative;
    }

    .hero-section .pfp {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        border: 5px solid yellow;
        transition: all 0.5s ease-in-out;
        z-index: 1000;
        cursor: pointer;
    }

    /* CORRECTED HOVER EFFECT SELECTOR */
    .pfp-container:hover .pfp {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1) rotate(720deg);
        z-index: 10000;
        border-color: white;
        border-radius: 100%;
        box-shadow: 0 0 40px rgba(255, 255, 0, 0.9);
        cursor: default;
    }

    .hero-section h1 {
        font-size: 4em;
        margin-top: 0.5em;
        margin-bottom: 0.1em;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        opacity: 0;
        animation: fadein 0.5s ease-out forwards;
        animation-delay: 0s;
    }

    .hero-section .secondary-text {
        font-size: 1.5em;
        margin-top: 0;
        margin-bottom: 1.5em;
        color: rgba(255, 255, 255, 0.8);
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        opacity: 0;
        animation: fadein 0.5s ease-out forwards;
        animation-delay: 0.5s;
    }

    .hero-section .social-icons {
        margin-top: 2em;
        margin-bottom: 0;
    }

    /* --- Iframe Modal Styles --- */
    .iframe-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
    }

    .iframe-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
        background-color: black;
    }

    .close-button {
        position: absolute;
        bottom: 20px;
        right: 20px;
        background: none;
        border: none;
        color: white;
        font-size: 7em;
        cursor: pointer;
        z-index: 1001;
        transition: transform 0.2s;
    }

    .close-button:hover {
        transform: scale(1.2);
    }

    /* --- Settings Panel Styles --- */
    .settings-panel {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1100;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.2s ease-in-out, visibility 0.2s ease-in-out;
    }

    .settings-content {
        background-color: rgba(0, 0, 0, 0.8);
        border: 2px solid yellow;
        border-radius: 15px;
        padding: 2em;
        color: white;
        text-align: left;
        max-width: 500px;
        width: 90%;
        box-shadow: 0 0 20px rgba(255, 255, 0, 0.5);
        position: relative;
    }

    .settings-content h2 {
        text-align: center;
        margin-top: 0;
        margin-bottom: 1.5em;
        color: yellow;
    }

    .setting-item {
        margin-bottom: 1.5em;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    .setting-item label {
        font-size: 1.5em;
        cursor: pointer;
        flex-grow: 1;
    }

    .setting-item input[type="checkbox"] {
        appearance: none;
        width: 30px;
        height: 30px;
        border: 2px solid yellow;
        border-radius: 5px;
        outline: none;
        cursor: pointer;
        position: relative;
        transition: background-color 0.2s, border-color 0.2s;
    }

    .setting-item input[type="checkbox"]:checked {
        background-color: yellow;
        border-color: yellow;
    }

    .setting-item input[type="checkbox"]:checked::after {
        content: '\2713';
        font-size: 20px;
        color: black;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    /* Style for range input */
    .setting-item input[type="range"] {
        -webkit-appearance: none;
        width: 60%; /* Adjust width as needed */
        height: 8px;
        background: #ddd;
        border-radius: 5px;
        outline: none;
        opacity: 0.7;
        -webkit-transition: .2s;
        transition: opacity .2s;
        margin-left: 10px; /* Space between label and slider */
    }

    .setting-item input[type="range"]:hover {
        opacity: 1;
    }

    .setting-item input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: yellow;
        cursor: pointer;
    }

    .setting-item input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: yellow;
        cursor: pointer;
    }

    .setting-item .range-value {
        font-size: 1.2em;
        min-width: 70px; /* Ensure space for value display */
        text-align: right;
    }


    .settings-close-button {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        color: white;
        font-size: 2.5em;
        cursor: pointer;
        transition: transform 0.2s;
    }

    .settings-close-button:hover {
        transform: scale(1.2);
        color: yellow;
    }

    /* --- Footer Styles --- */
    footer {
        background-color: rgba(0, 0, 0, 0.6);
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
        padding: 1.5em 1em;
        margin-top: auto;
        width: 100%;
        box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
        font-size: 0.9em;
        z-index: 2;
    }

    footer a {
        color: yellow;
        transition: color 0.25s;
    }

    footer a:hover {
        color: white;
    }

    /* --- Responsive Styles --- */
    @media only screen and (max-width: 1000px) {
        .hero-section h1 { font-size: 1.75em; }
        .hero-section .secondary-text { font-size: 1.2em; }
        h1 { font-size: 1.75em; }
        h2 { font-size: 1.5em; }
        p { font-size: 1.2em; }
        .close-button { font-size: 6em; bottom: 10px; right: 10px; }
        .settings-content { padding: 1.5em; }
        .setting-item label { font-size: 1.2em; }
        .settings-close-button { font-size: 2em; top: 5px; right: 10px; }
        footer { padding: 1em 0.5em; font-size: 0.8em; }
    }

    @media only screen and (max-width: 768px) {
        .hero-section h1 { font-size: 2em; }
        .hero-section .secondary-text { font-size: 1em; }
        h1 { font-size: 1.75em; }
        h2 { font-size: 1.5em; }
        p { font-size: 1em; }
        .social-logo .fa-5x { font-size: 4em; } /* Reduce icon size */
        .close-button { font-size: 5em; bottom: 5px; right: 5px; } /* Adjust close button for smaller screens */
        .settings-close-button { font-size: 1.8em; top: 5px; right: 8px; } /* Adjust settings close button */
    }
</style>

<body>
    <div class="hero-section">
        <div class="pfp-container">
            <!-- Replaced local image with a placeholder -->
            <img class="pfp" src="./photographer.jpg" alt="Profile Picture"/>
        </div>
        <h1>📷 TheDoShoots 📷</h1>
        <div class="secondary-text">By <a href="https://timothydo.me">Timothy Do</a></div>
        <div class="center box">
            <h2>👋 <a href="./about.html" class="gallery-link">About Me</a></h2>
        </div>
        <div class="center box">
            <h2>🌌 <a href="./astronomy/index.html" class="gallery-link">Astrophotography</a></h2>
        </div>
        <div class="center box">
            <h2>🐿️ <a href="./wildlife/index.html" class="gallery-link">Wildlife</a></h2>
        </div>
        <div class="social-icons">
            <a class="social-logo" href="https://instagram.com/thedoshoots"><i class="fab fa-instagram fa-5x" style="color: white;"></i></a>
            <a class="social-logo" href="https://www.flickr.com/people/169526448@N03/"><i class="fab fa-flickr fa-5x" style="color: white;"></i></a>
            <a class="social-logo gallery-link" href="#">
                <i class="fas fa-envelope fa-5x" style="color: white;"></i>
            </a>
            <button id="fullscreenToggle" class="social-logo" title="Toggle Fullscreen">
                <i class="fas fa-expand fa-5x fa-fw"></i> </button>
            <button id="settingsToggle" class="social-logo" title="Settings">
                <i class="fas fa-cog fa-5x fa-fw"></i>
            </button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 <a href="https://timothydo.me/">Timothy Do</a>. All Rights Reserved.</p>
    </footer>

    <div class="iframe-overlay" id="galleryOverlay">
        <button class="close-button" id="closeGallery">🏠</button>
        <iframe id="galleryIframe" src="" frameborder="0"></iframe>
    </div>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-content">
            <button class="settings-close-button" id="closeSettings">✕</button>
            <h2>Settings</h2>
            <div class="setting-item">
                <label for="galleryToggle">Gallery Mode</label>
                <input type="checkbox" id="galleryToggle">
            </div>
            <div class="setting-item">
                <label for="datasaverToggle">Data Saver Mode</label>
                <input type="checkbox" id="datasaverToggle">
            </div>
            <div class="setting-item">
                <label for="fullscreenToggleSetting">Auto Fullscreen</label>
                <input type="checkbox" id="fullscreenToggleSetting">
            </div>
            <div class="setting-item">
                <label for="directLinksToggle">Direct Links</label>
                <input type="checkbox" id="directLinksToggle">
            </div>
            <!-- NEW SETTING: Gallery Duration -->
            <div class="setting-item">
                <label for="galleryDuration">Gallery Duration</label>
                <input type="range" id="galleryDuration" min="250" max="15000" step="250">
                <span class="range-value" id="galleryDurationValue"></span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleryLinks = document.querySelectorAll('.gallery-link');
            const galleryOverlay = document.getElementById('galleryOverlay');
            const closeButton = document.getElementById('closeGallery');
            const fullscreenToggle = document.getElementById('fullscreenToggle');
            const settingsToggle = document.getElementById('settingsToggle');
            const settingsPanel = document.getElementById('settingsPanel');
            const closeSettingsButton = document.getElementById('closeSettings');

            // Settings elements
            const galleryToggle = document.getElementById('galleryToggle');
            const datasaverToggle = document.getElementById('datasaverToggle');
            const fullscreenToggleSetting = document.getElementById('fullscreenToggleSetting');
            const directLinksToggle = document.getElementById('directLinksToggle');
            // NEW: Gallery Duration elements
            const galleryDurationRange = document.getElementById('galleryDuration');
            const galleryDurationValueSpan = document.getElementById('galleryDurationValue');


            // Debug mode variable
            let debugMode = false;

            // Function to save a single setting to localStorage
            function saveSetting(id, value) {
                localStorage.setItem(id, value);
            }

            // Function to load all settings from localStorage and apply them, then override with URL parameters
            function loadSettings() {
                // Load from localStorage
                galleryToggle.checked = localStorage.getItem('galleryToggle') === 'true';
                datasaverToggle.checked = localStorage.getItem('datasaverToggle') === 'true';
                fullscreenToggleSetting.checked = localStorage.getItem('fullscreenToggleSetting') === 'true';
                directLinksToggle.checked = localStorage.getItem('directLinksToggle') === 'true';

                // NEW: Load galleryDuration from localStorage
                let storedDuration = parseInt(localStorage.getItem('galleryDuration'), 10);
                // Ensure it's a valid number and within range, otherwise use a default (5000ms)
                if (isNaN(storedDuration) || storedDuration < 250 || storedDuration > 15000) {
                    storedDuration = 5000; // Default value: 5 seconds
                }
                galleryDurationRange.value = storedDuration;
                // Display in seconds in the UI
                galleryDurationValueSpan.textContent = `${(storedDuration / 1000).toFixed(1)}s`;

                // Apply URL parameters, overriding localStorage
                const urlParams = new URLSearchParams(window.location.search);

                // Check for debug parameter
                if (urlParams.has('debug')) {
                    debugMode = urlParams.get('debug') === 'true' || urlParams.get('debug') === ''; // Handles ?debug or ?debug=true
                    if (debugMode) {
                        console.log('Debug mode enabled.');
                    }
                }

                if (urlParams.has('gallery')) {
                    galleryToggle.checked = urlParams.get('gallery') === 'true';
                    saveSetting('galleryToggle', galleryToggle.checked); // Also save to localStorage if from URL
                }
                if (urlParams.has('datasaver')) {
                    datasaverToggle.checked = urlParams.get('datasaver') === 'true';
                    saveSetting('datasaverToggle', datasaverToggle.checked);
                }
                if (urlParams.has('fullscreen')) {
                    fullscreenToggleSetting.checked = urlParams.get('fullscreen') === 'true';
                    saveSetting('fullscreenToggleSetting', fullscreenToggleSetting.checked);
                }
                if (urlParams.has('directlinks')) {
                    directLinksToggle.checked = urlParams.get('directlinks') === 'true';
                    saveSetting('directLinksToggle', directLinksToggle.checked);
                }
                // NEW: Load galleryDuration from URL
                if (urlParams.has('galleryDuration')) {
                    let urlDuration = parseInt(urlParams.get('galleryDuration'), 10);
                    if (!isNaN(urlDuration) && urlDuration >= 250 && urlDuration <= 15000) {
                        galleryDurationRange.value = urlDuration;
                        saveSetting('galleryDuration', urlDuration);
                        // Display in seconds in the UI
                        galleryDurationValueSpan.textContent = `${(urlDuration / 1000).toFixed(1)}s`;
                    }
                }
            }

            // Function to build a URL with current settings as parameters
            function buildUrlWithSettings(baseUrl) {
                // Use window.location as the base for resolving the URL.
                // This handles both web server (http/https) and local file (file://) paths correctly
                // by resolving baseUrl relative to the current document's location.
                const url = new URL(baseUrl, window.location);

                // Append current settings as parameters (only if true)
                if (galleryToggle.checked) {
                    url.searchParams.set('gallery', 'true');
                } else {
                    url.searchParams.delete('gallery');
                }

                if (datasaverToggle.checked) {
                    url.searchParams.set('datasaver', 'true');
                } else {
                    url.searchParams.delete('datasaver');
                }

                if (fullscreenToggleSetting.checked) {
                    url.searchParams.set('fullscreen', 'true');
                } else {
                    url.searchParams.delete('fullscreen');
                }

                if (directLinksToggle.checked) {
                    url.searchParams.set('directlinks', 'true');
                } else {
                    url.searchParams.delete('directlinks');
                }

                // NEW: Add galleryDuration to URL parameters if it's not the default
                const currentGalleryDuration = parseInt(galleryDurationRange.value, 10);
                const defaultGalleryDuration = 5000; // Must match default in loadSettings
                if (currentGalleryDuration !== defaultGalleryDuration) {
                    url.searchParams.set('galleryDuration', currentGalleryDuration);
                } else {
                    url.searchParams.delete('galleryDuration');
                }

                return url.toString();
            }

            // Store original hrefs for gallery links and then update them
            galleryLinks.forEach(link => {
                link.setAttribute('data-original-href', link.getAttribute('href'));
            });

            // Call loadSettings on DOMContentLoaded to initialize checkbox states and debug mode
            loadSettings();
            // Initialize link hrefs after settings are loaded
            updateGalleryLinkHrefs();

            // Attach event listeners for saving settings AND updating link hrefs
            galleryToggle.addEventListener('change', () => {
                saveSetting('galleryToggle', galleryToggle.checked);
                updateGalleryLinkHrefs();
            });
            datasaverToggle.addEventListener('change', () => {
                saveSetting('datasaverToggle', datasaverToggle.checked);
                updateGalleryLinkHrefs();
            });
            fullscreenToggleSetting.addEventListener('change', () => {
                saveSetting('fullscreenToggleSetting', fullscreenToggleSetting.checked);
                updateGalleryLinkHrefs();
            });
            directLinksToggle.addEventListener('change', () => {
                saveSetting('directLinksToggle', directLinksToggle.checked);
                updateGalleryLinkHrefs();
            });
            // NEW: Event listener for galleryDuration range input
            galleryDurationRange.addEventListener('input', () => {
                const value = parseInt(galleryDurationRange.value, 10); // Ensure value is an integer
                // Display in seconds in the UI
                galleryDurationValueSpan.textContent = `${(value / 1000).toFixed(1)}s`;
                saveSetting('galleryDuration', value);
                updateGalleryLinkHrefs(); // Update URL params on link if this changes
            });


            function updateGalleryLinkHrefs() {
                galleryLinks.forEach(link => {
                    const originalHref = link.getAttribute('data-original-href');
                    const urlWithSettings = buildUrlWithSettings(originalHref);
                    link.setAttribute('href', urlWithSettings);
                });
            }

            galleryLinks.forEach(link => {
                link.addEventListener('click', (event) => {
                    // Always use the data-original-href as the base for building the URL
                    const originalHref = link.getAttribute('data-original-href');
                    const urlWithSettings = buildUrlWithSettings(originalHref);

                    // If direct links are enabled, open in new tab with updated URL
                    if (directLinksToggle.checked) {
                        if (debugMode) {
                            console.log('Opening direct link with URL:', urlWithSettings);
                        }
                        window.open(urlWithSettings, '_blank'); // Open in new tab (due to <base target="_blank">)
                        event.preventDefault(); // Prevent original link click
                        return;
                    }

                    event.preventDefault(); // Prevent default if opening in iframe

                    const galleryIframe = document.getElementById('galleryIframe');
                    galleryIframe.src = urlWithSettings; // Set iframe src with params

                    if (debugMode) { // Log the iframe URL when loading
                        console.log('Loading iframe with URL:', urlWithSettings);
                    }

                    galleryOverlay.style.visibility = 'visible';
                    galleryOverlay.style.opacity = '1';
                    document.body.style.overflow = 'hidden';
                });
            });

            const closeIframeOverlay = () => {
                galleryOverlay.style.opacity = '0';
                galleryOverlay.addEventListener('transitionend', function handleTransitionEnd() {
                    if (galleryOverlay.style.opacity === '0') {
                        galleryOverlay.style.visibility = 'hidden';
                        document.body.style.overflow = '';
                        // Optionally clear iframe src when closed to prevent background playback
                        document.getElementById('galleryIframe').src = '';
                    }
                    galleryOverlay.removeEventListener('transitionend', handleTransitionEnd);
                }, { once: true });
            };

            closeButton.addEventListener('click', closeIframeOverlay);
            galleryOverlay.addEventListener('click', (event) => {
                if (event.target === galleryOverlay) closeIframeOverlay();
            });

            const toggleFullscreen = () => {
                document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
            }

            const openSettingsPanel = () => {
                settingsPanel.style.visibility = 'visible';
                settingsPanel.style.opacity = '1';
                document.body.style.overflow = 'hidden';
            };

            const closeSettingsPanel = () => {
                settingsPanel.style.opacity = '0';
                settingsPanel.addEventListener('transitionend', function handleTransitionEnd() {
                    if (settingsPanel.style.opacity === '0') {
                        settingsPanel.style.visibility = 'hidden';
                        document.body.style.overflow = '';
                    }
                    settingsPanel.removeEventListener('transitionend', handleTransitionEnd);
                }, { once: true });
            };

            fullscreenToggle.addEventListener('click',toggleFullscreen);
            settingsToggle.addEventListener('click', openSettingsPanel);
            closeSettingsButton.addEventListener('click', closeSettingsPanel);
            settingsPanel.addEventListener('click', (event) => {
                if (event.target === settingsPanel) closeSettingsPanel();
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    if (galleryOverlay.style.opacity === '1') closeIframeOverlay();
                    if (settingsPanel.style.opacity === '1') closeSettingsPanel();
                }
            });
        });
    </script>
</body>

</html>
