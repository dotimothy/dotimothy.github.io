<!doctype html>

<html>

<head>
	<title>Timothy Do's Photo Galleries</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
	<link href='https://fonts.googleapis.com/css?family=Product+Sans' rel='stylesheet' type='text/css'>
	<meta charset="utf-8" />
</head>

<base target="_blank">

<style>
	* {
		font-family: Product Sans;
	}
	body {
		background-color: black;
	}
	h1,h2 {
		color: white;
	}
	a {
		color:  blue;
	}
	a:hover {
		color: yellow;
		transition: 0.25s;
	}
	.pfp {
		clip-path:  circle();
		margin-left:  auto;
		margin-right:  auto;
		display: block;
		transition: 0.25s;
		animation: fadein 1s;
	}
	.pfp:hover {
		transform: scale(2.5) translateY(50%);
		transition: 0.25s;
	}
	.center {
		margin: auto;
		border-radius: 50px;
		padding: 0.5em;
		text-align: center;
	}
	.box {
		border: 0.25em solid yellow;
		background-color: yellow;
		padding: 0.5em;
		margin-bottom: 1em;
		animation: fadein 1s;
	}
	.box:hover {
		background-color: white;
		border: 0.25em solid white;
		transition: 0.25s;
	}
	@keyframes fadein {
		0% {opacity: 0%;}
		100% {opacity: 100%;}
	}
	/* Desktop */
	@media only screen and (min-width: 1000px) {
		h1 { font-size:  3.5em; }
		h2 { font-size:  2.5em; }
		.center { width: 50%; }
		.pfp { width: 30%; }
	}
	/* Mobile */
	@media only screen and (max-width: 1000px) {
		h1 { font-size: 5em; }
		h2 { font-size:  4em; }
		.center { width: 75%; }
		.pfp { width: 50%; }
	}
</style>

<body>
	<div class="center">
		<img class="pfp" src="./photographer.jpg" alt="EagleScout">
		<h1>📷 <a href="https://timothydo.me">TheDoShoots</a>'s Photo Galleries 📷</h1>
	</div>
	<div class="center box">
		<h2>🌌<a href="https://timothydo.me/astronomy/photography">Astrophotography</a></h2>
	</div>
</body>

</html>
