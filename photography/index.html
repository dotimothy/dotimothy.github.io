<!doctype html>

<html>

<head>
    <title>TheDoShoots</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href='https://fonts.googleapis.com/css?family=Product+Sans' rel='stylesheet' type='text/css'>
    <meta charset="utf-8" />
</head>

<base target="_blank">

<style>
    * {
        font-family: Product Sans;
        box-sizing: border-box; /* Add this for consistent box model */
    }
    body {
        background-color: black;
        margin: 0; /* Remove default body margin */
        padding: 0;
    }
    h1,h2 {
        color: white;
    }
    a {
        color:  blue;
    }
    a:hover {
        color: yellow;
        transition: 0.25s;
    }
    .pfp {
        clip-path:  circle();
        margin-left:  auto;
        margin-right:  auto;
        display: block;
        transition: 0.25s;
        animation: fadein 1s;
    }
    .pfp:hover {
        transform: scale(2.5) translateY(50%);
        transition: 0.25s;
    }
    .center {
        margin: auto;
        border-radius: 50px;
        padding: 0.5em;
        text-align: center;
    }
    .box {
        border: 0.25em solid yellow;
        background-color: yellow;
        padding: 0.5em;
        margin-bottom: 1em;
        animation: fadein 1s;
    }
    .box:hover {
        background-color: white;
        border: 0.25em solid white;
        transition: 0.25s;
    }
    .social-icons {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        animation: fadein 1s;
    }
    /* This class is now used for both social links and the fullscreen button */
    .social-logo {
        opacity: 1;
        transition: opacity 0.25s;
        color: white; /* Explicitly set color for button icon */
        background: none; /* Remove default button background */
        border: none; /* Remove default button border */
        cursor: pointer; /* Indicate clickable */
        padding: 0; /* Remove default button padding */
        /* REMOVED font-size here, let fa-X classes control it */
    }
    .social-logo:hover {
        opacity: 0.5;
        transition: opacity 0.25s;
    }
    @keyframes fadein {
        0% {opacity: 0%;}
        100% {opacity: 100%;}
    }

    /* Styles for the iframe modal/overlay */
    .iframe-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.85); /* Darker overlay */
        display: flex; /* Always display flex so content is centered */
        justify-content: center;
        align-items: center;
        z-index: 1000; /* Ensure it's on top */

        opacity: 0; /* Hidden by default */
        visibility: hidden; /* Truly hidden, not just invisible */
        transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out; /* Smooth transition */
    }

    /* Make the iframe fill the overlay */
    .iframe-overlay iframe {
        width: 100%;
        height: 100%;
        border: none;
        background-color: black;
    }

    .close-button {
        position: absolute;
        top: 10px;
        right: 15px;
        background: none;
        border: none;
        color: white;
        font-size: 7em; /* Doubled from 3.5em for desktop */
        cursor: pointer;
        z-index: 1001; /* Ensure close button is above iframe */
        transition: transform 0.2s;
    }

    .close-button:hover {
        transform: scale(1.2);
    }


    /* Default desktop styles */
    h1 { font-size:  3.5em; }
    h2 { font-size:  2.5em; }
    .center { width: 50%; }
    .pfp { width: 30%; }

    /* Mobile styles */
    @media only screen and (max-width: 1000px) {
        h1 { font-size: 5em; }
        h2 { font-size:  4em; }
        .center { width: 75%; }
        .pfp { width: 50%; }
        .close-button { font-size: 6em; top: 5px; right: 10px; } /* Doubled from 3em for mobile */
        /* REMOVED font-size from .social-logo here too */
    }

    /* --- NEW: Styles for Fullscreen Mode --- */
    /* These styles apply when the document is in fullscreen, overriding mobile styles if needed */
    :fullscreen,
    :-webkit-full-screen,
    :-moz-full-screen,
    :-ms-fullscreen {
        /* Revert to desktop-like layout */
        h1 { font-size: 3.5em; }
        h2 { font-size: 2.5em; }
        .center { width: 50%; }
        .pfp { width: 30%; }
        .close-button { font-size: 7em; top: 10px; right: 15px; }
        /* Social icons will automatically be desktop size from fa-5x */
    }

    /* Specific adjustments for elements that might still be affected by mobile styles in fullscreen */
    :fullscreen body,
    :-webkit-full-screen body,
    :-moz-full-screen body,
    :-ms-fullscreen body {
        padding: 0; /* Reset mobile body padding if any was applied */
    }

    :fullscreen .center,
    :-webkit-full-screen .center,
    :-moz-full-screen .center,
    :-ms-fullscreen .center {
        /* Ensure content is centered on larger screens in fullscreen */
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    /* --- END NEW --- */
</style>

<body>
    <div class="center">
        <img class="pfp" src="./photographer.jpg" alt="EagleScout">
        <h1>📷 <a href="https://timothydo.me">TheDoShoots</a> 📷</h1>
    </div>
    <div class="center box">
        <h2>🌌<a href="./astronomy/index.html" class="gallery-link" data-gallery-id="astronomy">Astrophotography</a></h2>
    </div>
    <div class="center box">
        <h2>🐿️<a href="./wildlife/index.html" class="gallery-link" data-gallery-id="wildlife">Wildlife</a></h2>
    </div>
    <div class="center box">
        <h2>👋<a href="./about.html" class="gallery-link" data-gallery-id="about">About Me</a></h2>
    </div>
            
    <div class="social-icons">
        <a class="social-logo" href="https://instagram.com/thedoshoots"><i class="fab fa-instagram fa-5x" style="color: white;"></i></a>
        <a class="social-logo" href="https://www.flickr.com/photos/169526448@N03/"><i class="fab fa-flickr fa-5x" style="color: white;"></i></a>
        <button id="fullscreenToggle" class="social-logo" title="Toggle Fullscreen">
            <i class="fas fa-expand fa-5x fa-fw"></i> </button>
    </div>

    <div class="iframe-overlay" id="galleryOverlay">
        <button class="close-button" id="closeGallery">&times;</button>
        <iframe id="galleryIframe" src="" frameborder="0"></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const galleryLinks = document.querySelectorAll('.gallery-link');
            const galleryOverlay = document.getElementById('galleryOverlay');
            const galleryIframe = document.getElementById('galleryIframe');
            const closeButton = document.getElementById('closeGallery');
            const fullscreenToggle = document.getElementById('fullscreenToggle');

            // --- NEW: Detect mobile once at the start ---
            const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            // --- END NEW ---

            // Function to close the iframe overlay
            const closeIframeOverlay = () => {
                galleryOverlay.style.opacity = '0'; // Start fade out
                // Wait for the transition to finish before setting visibility to hidden
                galleryOverlay.addEventListener('transitionend', function handleTransitionEnd() {
                    // Only hide visibility if it's currently fading out (opacity is 0)
                    if (galleryOverlay.style.opacity === '0') {
                        galleryOverlay.style.visibility = 'hidden';
                        document.body.style.overflow = ''; // Re-enable body scrolling
                        galleryIframe.src = ''; // Clear the iframe src to stop any media playing
                    }
                    // Remove the event listener to prevent it from firing on other transitions
                    galleryOverlay.removeEventListener('transitionend', handleTransitionEnd);
                });
            };

            galleryLinks.forEach(link => {
                link.addEventListener('click', (event) => {
                    event.preventDefault(); // Prevent default link behavior (navigating to the page)
                    let contentUrl = event.currentTarget.href; // Get the URL from the clicked link

                    // --- NEW: Modify URL if mobile device is detected ---
                    if (isMobileDevice) {
                        try {
                            const url = new URL(contentUrl);
                            url.searchParams.append('datasaver', 'true'); // Add the datasaver parameter
                            contentUrl = url.toString(); // Update contentUrl with the new parameter
                        } catch (e) {
                            console.error("Could not append datasaver to URL:", contentUrl, e);
                        }
                    }
                    // --- END NEW ---
                    
                    galleryIframe.src = contentUrl; // Set the iframe's source to the (potentially modified) URL
                    
                    // Show the overlay with fade-in effect
                    galleryOverlay.style.visibility = 'visible';
                    galleryOverlay.style.opacity = '1';

                    // Optional: Add a class to body to disable scrolling while overlay is open
                    document.body.style.overflow = 'hidden';
                });
            });

            closeButton.addEventListener('click', closeIframeOverlay);

            // Optional: Close overlay if user clicks directly on the overlay (outside iframe/close button)
            galleryOverlay.addEventListener('click', (event) => {
                if (event.target === galleryOverlay) {
                    closeIframeOverlay();
                }
            });

            // Keyboard event listener for Escape key
            document.addEventListener('keydown', (event) => {
                // Check if the overlay is currently visible and the pressed key is Escape
                if (galleryOverlay.style.opacity === '1' && event.key === 'Escape') {
                    closeIframeOverlay();
                }
                // Handle Escape key to exit fullscreen even if overlay isn't open
                if (document.fullscreenElement || document.mozFullScreenElement || document.webkitFullscreenElement || document.msFullscreenElement) {
                    if (event.key === 'Escape') {
                        toggleFullscreen(); // Use the new fullscreen toggle function
                    }
                }
            });


            // --- Fullscreen Toggle Logic ---
            function toggleFullscreen() {
                if (!document.fullscreenElement &&
                    !document.mozFullScreenElement &&
                    !document.webkitFullscreenElement &&
                    !document.msFullscreenElement) {
                    // Request fullscreen
                    if (document.documentElement.requestFullscreen) {
                        document.documentElement.requestFullscreen();
                    } else if (document.documentElement.mozRequestFullScreen) { /* Firefox */
                        document.documentElement.mozRequestFullScreen();
                    } else if (document.documentElement.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                        document.documentElement.webkitRequestFullscreen();
                    } else if (document.documentElement.msRequestFullscreen) { /* IE/Edge */
                        document.documentElement.msRequestFullscreen();
                    }
                } else {
                    // Exit fullscreen
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    } else if (document.mozCancelFullScreen) { /* Firefox */
                        document.mozCancelFullScreen();
                    } else if (document.webkitExitFullscreen) { /* Chrome, Safari and Opera */
                        document.documentElement.webkitExitFullscreen();
                    } else if (document.msExitFullscreen) { /* IE/Edge */
                        document.documentElement.msExitFullscreen();
                    }
                }
            }

            fullscreenToggle.addEventListener('click', toggleFullscreen);
        });
    </script>
</body>

</html>
