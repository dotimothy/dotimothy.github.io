<!doctype html>

<html>

<head>
	<title>Timothy's Linktree</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌲</text></svg>">
	<link href='https://fonts.googleapis.com/css?family=Product+Sans' rel='stylesheet' type='text/css'>
	<meta charset="utf-8" />
</head>

<base target="_blank">

<style>
	* {
		font-family: Product Sans;
	}
	body {
		background-color: black;
	}
	h1,h2 {
		color: white;
	}
	h1 {
		font-size: 2.5em;
	}
	h2 {
		font-size: 2em;
	}
	a {
		color:  blue;
	}
	a:hover {
		color: yellow;
		transition: 0.25s;
	}
	.pfp {
		clip-path:  circle();
		margin-left:  auto;
		margin-right:  auto;
		display: block;
		transition: 0.25s;
	}
	.pfp:hover {
		transform: scale(2.5) translateY(50%);
		transition: 0.25s;
	}
	.center {
		margin: auto;
		width: 50%;
		border-radius: 50px;
		padding: 0.5em;
		text-align: center;
	}
	.box {
		border: 0.25em solid yellow;
		background-color: yellow;
		padding: 0.5em;
		margin-bottom: 1em;
	}
	.box:hover {
		background-color: white;
		border: 0.25em solid white;
		transition: 0.25s;
	}
</style>

<body>
	<div class="center">
		<img width="30%" class="pfp" src="./images/roycepfp.jpg" alt="UCLA">
		<h1>Timothy Do</h1>
	</div>
	<div class="center box">
		<h2>🌐<a href="https://timothydo.me">Personal Website</a></h2>
	</div>
	<div class="center box">
		<h2>💼<a href="https://www.linkedin.com/in/do-timothy">Linkedin</a></h2>
	</div>
	<div class="center box">
		<h2>🧑‍💻<a href="https://github.com/dotimothy">Github</a></h2>
	</div>
	<div class="center box">
		<h2>📽️<a href="https://www.youtube.com/channel/UCHb4LxCdCbQ9e0gnHGIUgHw">YouTube</a></h2>
	</div>
</body>

</html>
