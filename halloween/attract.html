<!DOCTYPE html>

<html>
	<script>
		const colors = ['black','white','orange'];
		let i = 0;
		let period = 125;
		
		function switchBodyColor(color) {
			document.body.style.backgroundColor = color; 
		}	

		let interval = setInterval(function() {
			i += 1;
			switchBodyColor(colors[i % colors.length]);
		},period);

		function changeInterval(newPeriod) {
			period = newPeriod; 
			clearInterval(interval);
			interval = setInterval(function() {
				i += 1;
				switchBodyColor(colors[i % colors.length]);
			},period);
		}


		
	</script>
	<style>
		body {
			background-color: black;
		}
	</style>
	<head>
		<title>Halloween Attention Grabber</title>
		<link rel='icon' href='ghost.png'/>
	</head>
	<body>
	</body>
</html>
