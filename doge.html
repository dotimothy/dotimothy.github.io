<!DOCTYPE html>
<head>
	<title>Timothy's Doge</title>
	 <link rel="shortcut icon" type="image/png" href="https://dotimothy.github.io/images/doge.png" />
</head>

<script>
	function changeDoge()
	{
		console.log("changeDoge");
		document.getElementById('doge1').style.width = window.width * 0.4;
		document.getElementById('doge2').style.width = window.width * 0.4;
	}

	function refresh()
	{
		setTimeout(function() { 
			document.querySelector('h1').hidden = false;
		},500);
		setTimeout(function() { 
			document.querySelector('div').hidden = false;
			changeDoge();
		},4000);
		setTimeout(function() { window.location.reload();
		},15000);
	}
</script>

<style> 
	h1 {
		text-align: center;
		font-family: courier;
		z-index: 0;
	}
	h2 {
		font-family: courier;
	}
	div,embed
	{
		z-index: -1;
	}
	.doge {
	  animation: rotation 4.0s infinite linear;
	}
	@keyframes rotation {
	  0% {
	    transform: rotate(0deg);
	  }
	  25% {
	    transform: rotate(60deg);
	  }
	  50% {
	  	transform: rotate(360deg);
	  }
	  75% {
	  	transform:  rotate(-270deg);
	  }
	  100% {
	  	transfrom: rotate(-360deg);
	  }
	}

</style>

<body onload="refresh()">
	<h1 hidden>Timothy Do's Doge Server</h1> 
	<img id="doge1" class="doge" src="https://dotimothy.github.io/images/doge.png"style="position:absolute;top:15%;width:45%;pointer-events:none">
	<div hidden>
		<embed src="https://unmineable.com/coins/DOGE/address/DJGP6kgqh8BEsfEkHxxtrthqPHWu2PempY?fbclid=IwAR1xAMxLUwZ5PCJeK3-Iicb67C_nehgO5-YWBHPTHiNlefunkuOaBzK_4VE"/ width="100%" height="100%" scroll="no" style="position:absolute; pointer-events:none; top:-15%;">
	</div>
	<img id="doge2" class="doge" src="https://dotimothy.github.io/images/doge.png"style="position:absolute;top:15%;width:45%;left:55%;pointer-events:none">
</body>




</html>
