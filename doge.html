<script>
	function changeDoge()
	{
		console.log("changeDoge");
		document.getElementById('doge1').style.width = window.width * 0.4;
		document.getElementById('doge2').style.width = window.width * 0.4;
	}

	function refresh()
	{
		setTimeout(function() { 
			document.querySelector('h1').hidden = false;
			document.querySelector('h2').hidden = false;
		},500);
		setTimeout(function() { 
			document.querySelector('div').hidden = false;
			changeDoge();
		},500);
		setTimeout(function() { window.location.reload();
		},14000);
	}
</script>

<style> 
	h1, h2 {
		text-align: center;
		font-family: courier;
		z-index: 0;
	}
	div,embed
	{
		z-index: -1;
	}
	.doge {
	  animation: rotation 5.0s infinite linear;
	}
	@keyframes rotation {
	  0% {
	    transform: rotate(0deg);
	  }
	  25% {
	    transform: rotate(60deg);
	  }
	  50% {
	  	transform: rotate(360deg);
	  }
	  75% {
	  	transform:  rotate(-270deg);
	  }
	  100% {
	  	transfrom: rotate(-360deg);
	  }
	}

</style>
