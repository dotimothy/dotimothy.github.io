<body>
	<h1>📃 NPS Game: Guess it's Alpha Code! 📄</h1>

	<button onclick="displayRules()">Rules</button>

	<button id="gen" onclick="generatePark()">Generate Park</button>

	<div id="parkContainer">
	</div>

		<button onclick="verifyPark()">Guess Alpha Code</button>
	</div>

			<source src="./audio/ding.mp3">
		</audio>

	</div>
