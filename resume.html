<html>

<title>Timothy Do's Official Resume</title>
<link rel="shortcut icon" type="image/png" href="images/favicon.png" />
<meta charset="UTF-8">

<style>
	body {
		width: 100%;
		height:  100%;
		margin: 0;
	}
	p {
		font-family: Georgia;
		color: white;
		background-color: black;
		font-size: 3em;
		opacity: 0.75;
		position:  fixed;
	}
	p:hover {
		opacity: 0.25;
		transition: 0.25s;
	}
	p:active {
		opacity: 1;
		transition: 0.25s;
	}
	#downloadResume {
		bottom: 11%;
		right: 3%;
	}
	#printResume {
		bottom: 1%;
		right:  3%;
	}
</style>

<script>
function loadResume() {
  var container = document.getElementById("resume-container");
  var iframe = document.createElement("iframe");
  iframe.setAttribute("src", "https://docs.google.com/gview?url=https://dotimothy.github.io/Resume_Latex.pdf&embedded=true");
  iframe.setAttribute("width", "100%");
  iframe.setAttribute("height", "100%");
  iframe.setAttribute("frameborder", "0");
  container.appendChild(iframe);
}

function printResume() {
	var printFrame = document.getElementById("printFrame").contentWindow.document.print();
	window.location.reload();
}
</script>

<body onload="loadResume()">

<div id="resume-container"></div>
<iframe hidden id="printFrame" src="./Resume_Latex.pdf"></iframe>

</body>



<a href="./Resume_Latex.pdf" download="TimothyDo_Resume.pdf"><p id="downloadResume">Download 📝</p></a>
<p id="printResume" onclick='printResume()'>Print 🖨️</p>

</html>
