<html>

<title>Timothy Do's Official Resume</title>
<link rel="shortcut icon" type="image/png" href="images/favicon.png" />
<meta charset="UTF-8">

<style>
	body {
		width: 100%;
		height:  100%;
		margin: 0;
	}
	p {
		font-family: Georgia;
		color: white;
		background-color: black;
		font-size: 3em;
		position: fixed;
		bottom: 1%;
		right: 3%;
		opacity: 0.75;
	}
	p:hover {
		opacity: 0.25;
		transition: 0.25s;
	}
	p:active {
		opacity: 1;
		transition: 0.25s;
	}
</style>

<script>
function loadResume() {
  var container = document.getElementById("resume-container");
  var iframe = document.createElement("iframe");
  iframe.setAttribute("src", "https://docs.google.com/gview?url=https://dotimothy.github.io/Resume_Latex.pdf&embedded=true");
  iframe.setAttribute("width", "100%");
  iframe.setAttribute("height", "100%");
  iframe.setAttribute("frameborder", "0");
  container.appendChild(iframe);
}

function printResume() {
	var print = document.getElementById("print");
	var printWindow = print.contentWindow;
	printWindow.print();
	document.reload();
}
</script>

<body onload="loadResume()">

<div id="resume-container"></div>
<div id="print">
	<iframe hidden src="./Resume_Latex.pdf">
</div>

<script>
function loadResume() {
  var container = document.getElementById("resume-container");
  var iframe = document.createElement("iframe");
  iframe.setAttribute("src", "https://docs.google.com/gview?url=https://dotimothy.github.io/Resume_Latex.pdf&embedded=true");
  iframe.setAttribute("width", "100%");
  iframe.setAttribute("height", "100%");
  iframe.setAttribute("frameborder", "0");
  container.appendChild(iframe);
}

function printResume() {
	var print = document.getElementById("print");
	var printWindow = print.contentWindow;
	printWindow.print();
	document.reload();
}
</script>

</body>

<a href="./Resume_Latex.pdf" download="TimothyDo_Resume.pdf"><p>Download 📝</p></a>
<p onclick='printResume()'>Print 🖨️</p>

</html>
