<script>
	function reloadPage() {
			setTimeout(function(){location.reload();},250);
	}
</script>

<style>
	iframe {
		position:fixed; 
		top:0; 
		left:0; 
		bottom:0; 
		right:0; 
		width:100%; 
		height:100%; 
		border:none; 
		margin:0; 
		padding:0; 
		overflow:hidden; 
		z-index:0;
	}
	h1 {
		font-size: 3em;
		transform:  rotate(90deg);
		transition:  0.5s;
	}
	h1:hover {

	h1:active {

		transform: rotate(-270deg);
		transition: 0.25s;
	}
